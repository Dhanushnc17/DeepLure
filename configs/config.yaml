# ==============================================================================
# DeepLure AIE-CASE: Color-Invariant Saree Design Recognition Configuration
# ==============================================================================

# Project metadata
project:
  name: "deeplure_saree_recognition"
  seed: 42
  device: "cuda"  # 'cuda' or 'cpu'
  output_dir: "./outputs"
  checkpoint_dir: "./checkpoints"

# Dataset settings
data:
  # Path to dataset directory or CSV file
  # Expected directory structure: root/<design_id>/<colorway_or_sample_id>.jpg
  data_dir: "./data/processed"
  csv_path: null
  image_size: [256, 256]  # [H, W]
  
  # Color-invariance data augmentation strengths
  augmentation:
    color_jitter:
      enabled: true
      brightness: 0.4
      contrast: 0.4
      saturation: 0.8
      hue: 0.5  # Full circular hue shift to break color correlation
    random_grayscale:
      p: 0.35   # Force model to rely on structural edges/motifs
    random_invert:
      p: 0.1
    random_posterize:
      p: 0.2
    random_solarize:
      p: 0.2
    random_affine:
      p: 0.5
      rotation: 15
      shear: 10
      scale: [0.85, 1.15]
    random_perspective:
      p: 0.3
    random_crop_resize:
      scale: [0.75, 1.0]
      ratio: [0.8, 1.2]
    horizontal_flip:
      p: 0.5

  # Evaluation split settings
  split:
    val_ratio: 0.2
    query_ratio: 0.3  # Fraction of test samples reserved for query set (rest in gallery)
    min_samples_per_class: 2

# Model architecture
model:
  # Backbone choices:
  # - 'convnext_nano.in12k_ft_in1k' (Lean & high spatial texture fidelity)
  # - 'convnext_tiny.in12k_ft_in1k' (Default high-performance backbone)
  # - 'efficientnet_b0' (Ultra-lightweight / edge deployment)
  # - 'mobilenetv4_conv_small.e1200_r224_in1k' (Ultra fast mobile)
  # - 'vit_tiny_patch16_224' (Self-attention motif tokens)
  backbone: "convnext_nano.in12k_ft_in1k"
  pretrained: true
  embedding_dim: 256  # Compact & highly discriminative descriptor
  pooling: "gem"      # 'gem' (Generalized Mean), 'avg', or 'max'
  gem_p: 3.0
  gem_trainable: true
  dropout: 0.1
  
  # Adversarial Color Disentanglement
  adversarial_color_disentanglement:
    enabled: true
    num_color_clusters: 8
    grl_alpha: 0.2  # Gradient reversal strength

# Deep Metric Learning Head & Loss
loss:
  # Options: 'arcface', 'subcenter_arcface', 'cosface', 'supcon'
  type: "subcenter_arcface"
  
  # ArcFace / SubCenter ArcFace hyperparameters
  margin_s: 30.0     # Feature scale (hypersphere radius)
  margin_m: 0.40     # Angular margin in radians
  sub_centers: 3     # Sub-centers per design class (captures colorway sub-clusters per motif)
  
  # Contrastive & Adversarial Weights
  adversarial_weight: 0.15
  label_smoothing: 0.05

# Training Hyperparameters
train:
  batch_size: 32
  num_workers: 4
  epochs: 35
  mixed_precision: true  # PyTorch AMP (fp16 / bf16)
  
  # P-K Balanced Sampler (P design classes, K colorways per class per batch)
  sampler:
    use_pk_sampler: true
    p: 8  # Number of distinct design classes per batch
    k: 4  # Number of samples per class per batch (P * K = batch_size)
    
  optimizer:
    name: "adamw"
    lr: 0.0003
    backbone_lr_ratio: 0.1  # 10x smaller learning rate for pretrained backbone
    weight_decay: 0.01
    
  scheduler:
    name: "cosine_warmup"
    warmup_epochs: 3
    min_lr: 0.000001

# Evaluation & Metrics
evaluation:
  batch_size: 64
  metric: "cosine"  # 'cosine' or 'euclidean'
  top_k: [1, 3, 5, 10]
  re_ranking: false  # k-reciprocal re-ranking for enhanced retrieval
  verification_threshold: 0.65  # Calibrated cosine similarity threshold
